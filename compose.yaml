# Локальный стек: API, воркер очереди, планировщик, MySQL, Redis и Mailpit.
# Запуск: docker compose up -d → http://localhost:8080/docs/, письма — http://localhost:8025
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_USER: task_manager
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Наружу отдаём 3308: 3306 занят локальным MySQL, 3307 — соседними проектами.
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DOCKER_DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ловушка для писем: всё, что отправляет API, видно в веб-интерфейсе на :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  app:
    # Один образ на три роли. CI собирает его заранее и поднимает стек с --no-build.
    image: ${APP_IMAGE:-task-manager-api:local}
    build: .
    command: ["serve"]
    environment: &app-env
      APP_NAME: "Task Manager API"
      # Пустой ключ допустим: entrypoint сгенерирует временный. Но тогда у каждого
      # контейнера он свой и воркер не расшифрует задания API — задайте APP_KEY в .env.
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_DATABASE: task_manager
      DB_USERNAME: task_manager
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@task-manager.test
    volumes: &app-volumes
      # CSV-выгрузки пишет воркер, а скачивает API — нужен общий диск.
      - app-files:/app/storage/app/private
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: ${APP_IMAGE:-task-manager-api:local}
    build: .
    command: ["queue"]
    environment: *app-env
    volumes: *app-volumes
    # Healthcheck базового образа стучится по HTTP, а воркер порт не слушает.
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  schedule:
    image: ${APP_IMAGE:-task-manager-api:local}
    build: .
    command: ["schedule"]
    environment: *app-env
    volumes: *app-volumes
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  app-files:
