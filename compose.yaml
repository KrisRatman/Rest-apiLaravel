# Локальный стек: API, воркер очереди, MySQL и Redis.
# Запуск: docker compose up -d → http://localhost:8080/docs/
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_USER: task_manager
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Наружу отдаём 3308: 3306 занят локальным MySQL, 3307 — соседними проектами.
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DOCKER_DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    command: ["serve"]
    environment: &app-env
      APP_NAME: "Task Manager API"
      # Пустой ключ допустим: entrypoint сгенерирует временный.
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8080
      DB_HOST: mysql
      DB_DATABASE: task_manager
      DB_USERNAME: task_manager
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build: .
    command: ["queue"]
    environment: *app-env
    # Healthcheck базового образа стучится по HTTP, а воркер порт не слушает.
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
