openapi: 3.0.3
info:
  title: 'Task Manager API — документация'
  description: 'REST API для приложения задач: команды с ролями, проекты, задачи, комментарии и метки.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Авторизация
    description: 'Регистрация, вход и выход. Токен передаётся в заголовке `Authorization: Bearer {token}`.'
  -
    name: Профиль
    description: 'Данные текущего пользователя.'
  -
    name: Команды
    description: 'Команда объединяет людей и проекты. Роли в команде: `owner` (один), `admin`, `member`. Если вы не состоите в команде, её ресурсы отвечают 404.'
  -
    name: Проекты
    description: 'Проекты команды. Смотреть может любой участник, создавать, менять и удалять — владелец и админы.'
  -
    name: Задачи
    description: "Задачи проекта. Создавать, менять и комментировать может любой участник команды; удалять — автор задачи, владелец и админы.\n\n**Устарело:** эти эндпоинты и «Мои задачи» заменены версией v2 (см. «Задачи v2») и отдают заголовки `Deprecation`, `Sunset` и `Link`."
  -
    name: 'Задачи v2'
    description: 'Задачи в API v2: курсорная пагинация, статус и приоритет объектами `{value, label}`, вложенный автор `creator`. Тела запросов и права — те же, что в v1.'
  -
    name: Комментарии
    description: 'Обсуждение задачи. Писать может любой участник команды, править — только автор, удалять — автор, владелец и админы.'
  -
    name: Метки
    description: 'Цветные метки команды для задач. Видят все участники, управляют владелец и админы.'
  -
    name: Экспорт
    description: 'Выгрузка задач проекта в CSV. Файл собирается в фоне: запрос сразу отвечает 202, статус можно опрашивать, а по готовности приходит письмо. Выгрузка видна только автору и хранится 7 дней.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Токен выдают <code>POST /api/v1/auth/register</code> и <code>POST /api/v1/auth/login</code>. Передавайте его в заголовке <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: Регистрация
      operationId: ''
      description: 'Создаёт пользователя и сразу возвращает токен доступа.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user:
                      id: 1
                      name: 'Анна Смирнова'
                      email: anna@example.com
                      created_at: '2026-09-24T10:00:00.000000Z'
                    token: 1|m3Qx7lJ8u0bEw3kS0fVb2cN4pT6rY9aD1gH5jK8l
                    token_type: Bearer
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Анна Смирнова'
                          email:
                            type: string
                            example: anna@example.com
                          created_at:
                            type: string
                            example: '2026-09-24T10:00:00.000000Z'
                      token:
                        type: string
                        example: 1|m3Qx7lJ8u0bEw3kS0fVb2cN4pT6rY9aD1gH5jK8l
                      token_type:
                        type: string
                        example: Bearer
        422:
          description: 'Email уже занят'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email has already been taken.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The email has already been taken.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Авторизация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Имя пользователя. Must not be greater than 255 characters.'
                  example: 'Анна Смирнова'
                email:
                  type: string
                  description: 'Email, он же логин. Must be a valid email address. Must not be greater than 255 characters.'
                  example: anna@example.com
                password:
                  type: string
                  description: 'Пароль, минимум 8 символов.'
                  example: secret-pass-123
                device_name:
                  type: string
                  description: 'Название устройства — так токен будет подписан в списке сессий. По умолчанию `api`. Must not be greater than 255 characters.'
                  example: 'iPhone 15'
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: Вход
      operationId: ''
      description: 'Выдаёт новый токен для устройства. Не больше 5 попыток в минуту на пару email + IP.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    user:
                      id: 1
                      name: 'Анна Смирнова'
                      email: anna@example.com
                      created_at: '2026-09-24T10:00:00.000000Z'
                    token: 1|m3Qx7lJ8u0bEw3kS0fVb2cN4pT6rY9aD1gH5jK8l
                    token_type: Bearer
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Анна Смирнова'
                          email:
                            type: string
                            example: anna@example.com
                          created_at:
                            type: string
                            example: '2026-09-24T10:00:00.000000Z'
                      token:
                        type: string
                        example: 1|m3Qx7lJ8u0bEw3kS0fVb2cN4pT6rY9aD1gH5jK8l
                      token_type:
                        type: string
                        example: Bearer
        422:
          description: 'Неверный email или пароль'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'These credentials do not match our records.'
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  message:
                    type: string
                    example: 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
        429:
          description: 'Превышен лимит попыток'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Авторизация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email пользователя. Must be a valid email address.'
                  example: demo@example.com
                password:
                  type: string
                  description: Пароль.
                  example: password
                device_name:
                  type: string
                  description: 'Название устройства. По умолчанию `api`. Must not be greater than 255 characters.'
                  example: 'Pixel 8'
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: Выход
      operationId: ''
      description: 'Отзывает текущий токен. Токены других устройств продолжают работать.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Авторизация
  /api/v1/me:
    get:
      summary: 'Текущий пользователь'
      operationId: ''
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    name: 'Morgan Hirthe'
                    email: dare.emelie@example.com
                    created_at: '2026-09-24T11:44:08.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Morgan Hirthe'
                      email:
                        type: string
                        example: dare.emelie@example.com
                      created_at:
                        type: string
                        example: '2026-09-24T11:44:08.000000Z'
      tags:
        - Профиль
    patch:
      summary: 'Обновить профиль'
      operationId: ''
      description: 'Передавайте только те поля, которые нужно изменить.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    name: 'Ms. Audra Crooks II'
                    email: gulgowski.asia@example.com
                    created_at: '2026-09-24T11:44:08.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Ms. Audra Crooks II'
                      email:
                        type: string
                        example: gulgowski.asia@example.com
                      created_at:
                        type: string
                        example: '2026-09-24T11:44:08.000000Z'
      tags:
        - Профиль
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Новое имя. Must not be greater than 255 characters.'
                  example: 'Анна Петрова'
                email:
                  type: string
                  description: 'Новый email. Must be a valid email address. Must not be greater than 255 characters.'
                  example: anna.petrova@example.com
  /api/v1/me/password:
    put:
      summary: 'Сменить пароль'
      operationId: ''
      description: 'Требует текущий пароль. Все токены, кроме текущего, отзываются — другие устройства придётся войти заново.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                nullable: true
        422:
          description: 'Неверный текущий пароль'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password is incorrect.'
                  errors:
                    current_password:
                      - 'The password is incorrect.'
                properties:
                  message:
                    type: string
                    example: 'The password is incorrect.'
                  errors:
                    type: object
                    properties:
                      current_password:
                        type: array
                        example:
                          - 'The password is incorrect.'
                        items:
                          type: string
      tags:
        - Профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: 'Текущий пароль.'
                  example: password
                password:
                  type: string
                  description: 'Новый пароль, минимум 8 символов.'
                  example: new-secret-456
              required:
                - current_password
                - password
  /api/v1/teams:
    get:
      summary: 'Мои команды'
      operationId: ''
      description: 'Команды, в которых состоит пользователь, с его ролью в каждой (`my_role`).'
      parameters:
        -
          in: query
          name: per_page
          description: 'Размер страницы, 1–100.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Размер страницы, 1–100.'
            example: 15
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      name: 'Mobile Team'
                      description: 'iOS and Android apps of the online store'
                      owner_id: 1
                      my_role: owner
                      members_count: 3
                      projects_count: 2
                      created_at: '2026-09-24T10:00:00.000000Z'
                      updated_at: '2026-09-24T10:00:00.000000Z'
                  links:
                    first: …
                    last: …
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    last_page: 1
                    per_page: 15
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Mobile Team'
                        description: 'iOS and Android apps of the online store'
                        owner_id: 1
                        my_role: owner
                        members_count: 3
                        projects_count: 2
                        created_at: '2026-09-24T10:00:00.000000Z'
                        updated_at: '2026-09-24T10:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Mobile Team'
                        description:
                          type: string
                          example: 'iOS and Android apps of the online store'
                        owner_id:
                          type: integer
                          example: 1
                        my_role:
                          type: string
                          example: owner
                        members_count:
                          type: integer
                          example: 3
                        projects_count:
                          type: integer
                          example: 2
                        created_at:
                          type: string
                          example: '2026-09-24T10:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2026-09-24T10:00:00.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: …
                      last:
                        type: string
                        example: …
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 15
                      total:
                        type: integer
                        example: 1
      tags:
        - Команды
    post:
      summary: 'Создать команду'
      operationId: ''
      description: 'Создатель становится владельцем (`owner`).'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Mobile Team'
                    description: 'iOS and Android apps of the online store'
                    owner_id: 1
                    my_role: owner
                    members_count: 3
                    projects_count: 2
                    created_at: '2026-09-24T10:00:00.000000Z'
                    updated_at: '2026-09-24T10:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Mobile Team'
                      description:
                        type: string
                        example: 'iOS and Android apps of the online store'
                      owner_id:
                        type: integer
                        example: 1
                      my_role:
                        type: string
                        example: owner
                      members_count:
                        type: integer
                        example: 3
                      projects_count:
                        type: integer
                        example: 2
                      created_at:
                        type: string
                        example: '2026-09-24T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-09-24T10:00:00.000000Z'
      tags:
        - Команды
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название команды. Must not be greater than 255 characters.'
                  example: 'Мобильная разработка'
                description:
                  type: string
                  description: 'Описание команды. Must not be greater than 2000 characters.'
                  example: 'Команда iOS и Android'
                  nullable: true
              required:
                - name
  '/api/v1/teams/{id}':
    get:
      summary: Команда
      operationId: ''
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Mobile Team'
                    description: 'iOS and Android apps of the online store'
                    owner_id: 1
                    my_role: owner
                    members_count: 3
                    projects_count: 2
                    created_at: '2026-09-24T10:00:00.000000Z'
                    updated_at: '2026-09-24T10:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Mobile Team'
                      description:
                        type: string
                        example: 'iOS and Android apps of the online store'
                      owner_id:
                        type: integer
                        example: 1
                      my_role:
                        type: string
                        example: owner
                      members_count:
                        type: integer
                        example: 3
                      projects_count:
                        type: integer
                        example: 2
                      created_at:
                        type: string
                        example: '2026-09-24T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-09-24T10:00:00.000000Z'
        404:
          description: 'Команды нет или вы в ней не состоите'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Resource not found.'
                properties:
                  message:
                    type: string
                    example: 'Resource not found.'
      tags:
        - Команды
    put:
      summary: 'Изменить команду'
      operationId: ''
      description: 'Доступно владельцу и админам.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    name: 'Mobile Team'
                    description: 'iOS and Android apps of the online store'
                    owner_id: 1
                    my_role: owner
                    members_count: 3
                    projects_count: 2
                    created_at: '2026-09-24T10:00:00.000000Z'
                    updated_at: '2026-09-24T10:00:00.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Mobile Team'
                      description:
                        type: string
                        example: 'iOS and Android apps of the online store'
                      owner_id:
                        type: integer
                        example: 1
                      my_role:
                        type: string
                        example: owner
                      members_count:
                        type: integer
                        example: 3
                      projects_count:
                        type: integer
                        example: 2
                      created_at:
                        type: string
                        example: '2026-09-24T10:00:00.000000Z'
                      updated_at:
                        type: string
                        example: '2026-09-24T10:00:00.000000Z'
        403:
          description: 'Недостаточно прав'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
      tags:
        - Команды
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Новое название команды. Must not be greater than 255 characters.'
                  example: 'Мобильная команда'
                description:
                  type: string
                  description: 'Новое описание. Must not be greater than 2000 characters.'
                  example: null
                  nullable: true
    delete:
      summary: 'Удалить команду'
      operationId: ''
      description: 'Только владелец. Удаляются все проекты, задачи и метки команды.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Команды
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the team.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/teams/{team_id}/members':
    get:
      summary: 'Участники команды'
      operationId: ''
      description: 'Видит любой участник команды.'
      parameters:
        -
          in: query
          name: per_page
          description: 'Размер страницы, 1–100.'
          example: 50
          required: false
          schema:
            type: integer
            description: 'Размер страницы, 1–100.'
            example: 50
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      name: 'Иван Петров'
                      email: ivan@example.com
                      role: member
                      joined_at: '2026-09-24T10:00:00.000000Z'
                  links:
                    first: …
                    last: …
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    last_page: 1
                    per_page: 50
                    total: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        name: 'Иван Петров'
                        email: ivan@example.com
                        role: member
                        joined_at: '2026-09-24T10:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: 'Иван Петров'
                        email:
                          type: string
                          example: ivan@example.com
                        role:
                          type: string
                          example: member
                        joined_at:
                          type: string
                          example: '2026-09-24T10:00:00.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: …
                      last:
                        type: string
                        example: …
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 50
                      total:
                        type: integer
                        example: 1
      tags:
        - Команды
    post:
      summary: 'Добавить участника'
      operationId: ''
      description: 'Добавляет зарегистрированного пользователя по email.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: 'Иван Петров'
                    email: ivan@example.com
                    role: member
                    joined_at: '2026-09-24T10:00:00.000000Z'
                properties:
                  data:
